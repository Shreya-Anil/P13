
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SkillBridge Task Manager</title>
    <style>
        body {
            font-family: Arial;
            background-color: #eef2ff;
            margin: 0;
            padding: 30px;
        }

        .container {
            width: 70%;
            margin: auto;
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 0 10px #ccc;
        }

        h1 {
            text-align: center;
            color: #4338ca;
        }

        p {
            text-align: center;
            color: #555;
        }

        .input-area {
            display: flex;
            gap: 10px;
        }

        input {
            flex: 1;
            padding: 12px;
            border: 1px solid #aaa;
            border-radius: 6px;
        }

        button {
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            color: white;
            background: #4f46e5;
        }

        button:hover {
            opacity: 0.85;
        }

        ul {
            padding: 0;
        }
        li {
            list-style: none;
            background: #f3f4f6;
            margin-top: 12px;
            padding: 12px;
            border-radius: 7px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
        }

        .task-text {
            flex: 1;
            word-break: break-word;
        }

        .completed {
            text-decoration: line-through;
            color: gray;
        }

        .edit {
            background: #f59e0b;
        }

        .delete {
            background: #ef4444;
        }

        .done {
            background: #16a34a;
        }

        @media (max-width: 700px) {
            .container {
                width: 95%;
                box-sizing: border-box;
            }

            .input-area {
                flex-direction: column;
            }

            li {
                flex-wrap: wrap;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>SkillBridge Task Manager</h1>
        <p>Organize your learning activities and stay productive!</p>

        <div class="input-area">
            <input type="text" id="taskInput"
                   placeholder="Enter your task">

            <button onclick="addTask()">Add Task</button>
        </div>

        <h3>My Tasks</h3>

        <ul id="taskList"></ul>

    </div>

    <script>

        let tasks = JSON.parse(localStorage.getItem("tasks")) || [];

        function displayTasks() {

            let list = document.getElementById("taskList");
            list.innerHTML = "";

            tasks.forEach(function(task, index) {

                let li = document.createElement("li");

                let span = document.createElement("span");
                span.textContent = task.name;
                span.className = "task-text";

                if (task.completed) {
                    span.classList.add("completed");
                }

                let doneButton = document.createElement("button");
                doneButton.textContent = "Done";
                doneButton.className = "done";
                doneButton.onclick = function() {
                    completeTask(index);
                };

                let editButton = document.createElement("button");
                editButton.textContent = "Edit";
                editButton.className = "edit";
                editButton.onclick = function() {
                    editTask(index);
                };

                let deleteButton = document.createElement("button");
                deleteButton.textContent = "Delete";
                deleteButton.className = "delete";
                deleteButton.onclick = function() {
                    deleteTask(index);
                };

                li.appendChild(span);
                li.appendChild(doneButton);
                li.appendChild(editButton);
                li.appendChild(deleteButton);

                list.appendChild(li);
            });
        }

        function saveTasks() {
            localStorage.setItem("tasks", JSON.stringify(tasks));
        }

        function addTask() {

            let input = document.getElementById("taskInput");
            let taskName = input.value.trim();

            if (taskName === "") {
                alert("Please enter a task!");
                return;
            }

            tasks.push({
                name: taskName,
                completed: false
            });

            saveTasks();
            displayTasks();

            input.value = "";
        }

        function completeTask(index) {

            tasks[index].completed = !tasks[index].completed;

            saveTasks();
            displayTasks();
        }

        function editTask(index) {

            let newTask = prompt("Edit your task:", tasks[index].name);

            if (newTask !== null && newTask.trim() !== "") {
                tasks[index].name = newTask.trim();
                saveTasks();
                displayTasks();
            }
        }
        function deleteTask(index) {
            if (confirm("Are you sure you want to delete this task?")) {
                tasks.splice(index, 1);
                saveTasks();
                displayTasks();
            }
        }
        displayTasks();
    </script>
</body>
</html>
